<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Match archive</title>
<style>
:root{--bg:#0e1424;--panel:#17203a;--line:#2a3860;--text:#e8ecf7;--muted:#8d9ac0;--win:#f2c14e;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Bahnschrift,"Segoe UI",system-ui,sans-serif;line-height:1.4;padding:24px 16px 40px}
main{max-width:1100px;margin:0 auto}
h1{font-size:2rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
a.card{display:block;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px}
a.card:hover,a.card:focus-visible{border-color:var(--win);outline:none}
.date{color:var(--muted);font-size:.85rem;min-height:1.2em}
.title{font-weight:600;font-size:1.1rem;margin:4px 0 10px}
.teams{color:var(--muted);font-size:.9rem}
.score{display:flex;align-items:baseline;gap:10px;font-size:2rem;font-weight:700;margin-top:4px}
.score .w{color:var(--win)}
.score .d{color:var(--muted);font-weight:400}
.msg{color:var(--muted);max-width:70ch}
</style>
</head>
<body>
<main>
<h1>Match archive</h1>
<p class="sub" id="count">Loading matches…</p>
<div class="grid" id="grid"></div>
<p class="msg" id="msg"></p>
</main>
<script>
// Folder that holds the match pages. Only fill in owner and repo if the site
// uses a custom domain; on a github.io address they are detected automatically.
const CONFIG = { owner: '', repo: '', folder: 'matches' };

function repoInfo() {
  if (CONFIG.owner && CONFIG.repo) return CONFIG;
  const host = location.hostname;
  if (!host.endsWith('.github.io')) return null;
  const owner = host.split('.')[0];
  const repo = location.pathname.split('/')[1] || owner + '.github.io';
  return { owner, repo, folder: CONFIG.folder };
}

async function listFiles() {
  const info = repoInfo();
  if (info) {
    try {
      const r = await fetch('https://api.github.com/repos/' + info.owner + '/' + info.repo + '/contents/' + CONFIG.folder);
      if (r.ok) {
        const items = await r.json();
        return items.filter(f => f.type === 'file' && /\.html?$/i.test(f.name)).map(f => f.name);
      }
    } catch (e) { /* fall through to matches.json */ }
  }
  const r = await fetch('matches.json');
  if (!r.ok) throw new Error('No file list available');
  return await r.json();
}

async function readMatch(name) {
  const r = await fetch(CONFIG.folder + '/' + encodeURIComponent(name));
  if (!r.ok) throw new Error(name);
  const doc = new DOMParser().parseFromString(await r.text(), 'text/html');
  const meta = n => { const m = doc.querySelector('meta[name="' + n + '"]'); return m ? m.content.trim() : ''; };
  return {
    name,
    title: doc.title || name.replace(/\.html?$/i, ''),
    date: meta('match-date'),
    teams: meta('match-teams'),
    score: meta('match-score')
  };
}

function card(m) {
  const a = document.createElement('a');
  a.className = 'card';
  a.href = CONFIG.folder + '/' + encodeURIComponent(m.name);
  const add = (cls, text) => { const d = document.createElement('div'); d.className = cls; d.textContent = text; a.appendChild(d); return d; };
  add('date', m.date);
  add('title', m.title);
  if (m.teams) add('teams', m.teams);
  const parts = m.score.split('-').map(s => s.trim());
  if (parts.length === 2 && parts[0] !== '' && parts[1] !== '') {
    const s = add('score', '');
    const x = Number(parts[0]), y = Number(parts[1]);
    [[parts[0], x > y], ['|', null], [parts[1], y > x]].forEach(([t, win]) => {
      const sp = document.createElement('span');
      sp.textContent = t;
      if (win === null) sp.className = 'd'; else if (win) sp.className = 'w';
      s.appendChild(sp);
    });
  }
  return a;
}

(async () => {
  const count = document.getElementById('count');
  const msg = document.getElementById('msg');
  try {
    const names = await listFiles();
    const results = await Promise.allSettled(names.map(readMatch));
    const matches = results.filter(r => r.status === 'fulfilled').map(r => r.value);
    matches.sort((a, b) => (b.date || '').localeCompare(a.date || '') || a.name.localeCompare(b.name));
    const grid = document.getElementById('grid');
    matches.forEach(m => grid.appendChild(card(m)));
    count.textContent = matches.length === 1 ? '1 match' : matches.length + ' matches';
    if (!matches.length) msg.textContent = 'No match pages found. Add .html files to the ' + CONFIG.folder + ' folder.';
  } catch (e) {
    count.textContent = 'Couldn’t load the match list';
    msg.textContent = 'The list is read from the ' + CONFIG.folder + ' folder on GitHub, so this only works once the site is live on a public repository. When previewing locally, open the folder with a local web server, or add a matches.json file listing the page names.';
  }
})();
</script>
</body>
</html>
